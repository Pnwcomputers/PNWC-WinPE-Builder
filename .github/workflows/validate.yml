name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-powershell:
    name: Validate (powershell)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate repository
        run: ./tests/Invoke-RepositoryChecks.ps1
      - name: Test safety helpers
        run: ./tests/Invoke-SafetyTests.ps1
  powershell-core:
    name: Validate (pwsh)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate repository
        run: ./tests/Invoke-RepositoryChecks.ps1
      - name: Test safety helpers
        run: ./tests/Invoke-SafetyTests.ps1
